spring:
  application:
    name: airline-reservation-system

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/airline}
    username: ${SPRING_DATASOURCE_USERNAME:airline}
    password: ${SPRING_DATASOURCE_PASSWORD:airline}
    hikari:
      maximum-pool-size: 20
      pool-name: airline-pool

  jpa:
    open-in-view: false
    hibernate:
      # Migrations own the schema. 'validate' makes an entity/column mismatch
      # fail at startup instead of surfacing as a runtime error.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 32
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: filesystem:db/migrations

  jackson:
    time-zone: UTC
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

# Domain policy. Never hard-code these values in a service or an entity.
booking:
  window-days: 365
  max-seats: 9
  hold:
    ttl: PT5M
    sweep-interval: PT1M
    sweep-batch-size: 200

security:
  jwt:
    # HS256 rejects keys shorter than 32 bytes. Override in any real environment.
    secret: ${JWT_SECRET:dev-only-insecure-signing-key-replace-me-32b}
    expiry: PT1H

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{requestId:-}] %logger{36} - %msg%n"
  level:
    com.airline.booking: DEBUG
