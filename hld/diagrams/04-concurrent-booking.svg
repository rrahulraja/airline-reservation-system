<text x="985.0" y="124.5" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12.0" fill="#111111" text-anchor="middle">ux_seat_active</text>
<rect x="718.0" y="330.0" width="14.0" height="110.0" rx="0" fill="#ffcccc" stroke="#b85450" stroke-width="1" opacity="0.6"/>
<rect x="1110.0" y="330.0" width="330.0" height="70.0" rx="0" fill="#fff2cc" stroke="#d6b656" stroke-width="1" opacity="1.0"/>
<text x="1118.0" y="344.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="10.0" fill="#111111" text-anchor="start">Transaction B BLOCKS here on the index tuple</text>
<text x="1118.0" y="357.5" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="10.0" fill="#111111" text-anchor="start">Transaction A holds. No application lock was</text>
<text x="1118.0" y="371.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="10.0" fill="#111111" text-anchor="start">requested — Postgres serializes the two writers</text>
<text x="1118.0" y="384.5" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="10.0" fill="#111111" text-anchor="start">on the unique index itself.</text>
<rect x="1110.0" y="430.0" width="330.0" height="200.0" rx="0" fill="#d5e8d4" stroke="#82b366" stroke-width="2" opacity="1.0"/>
<text x="1118.0" y="444.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="10.0" fill="#111111" text-anchor="start">Outcome, asserted by test</text>
<text x="1118.0" y="471.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="10.0" fill="#111111" text-anchor="start">20 threads claiming &#x27;15A&#x27; on one flight:</text>
<text x="1118.0" y="484.5" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="10.0" fill="#111111" text-anchor="start">· exactly 1 success</text>
<text x="1118.0" y="498.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="10.0" fill="#111111" text-anchor="start">· 19 x SeatUnavailableException to 409</text>
<text x="1118.0" y="511.5" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="10.0" fill="#111111" text-anchor="start">· exactly 1 seat_assignment row in the table</text>
<text x="1118.0" y="538.5" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="10.0" fill="#111111" text-anchor="start">20 threads claiming 20 DISTINCT seats:</text>
<text x="1118.0" y="552.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="10.0" fill="#111111" text-anchor="start">· 20 successes, 0 failures</text>
<text x="1118.0" y="579.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="10.0" fill="#111111" text-anchor="start">The second case is what rules out SELECT FOR</text>
<text x="1118.0" y="592.5" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="10.0" fill="#111111" text-anchor="start">UPDATE: a row-lock design passes the first test</text>
<text x="1118.0" y="606.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="10.0" fill="#111111" text-anchor="start">but needlessly queues on the second.</text>
<rect x="30.0" y="750.0" width="1040.0" height="125.0" rx="0" fill="#fff2cc" stroke="#d6b656" stroke-width="1" opacity="1.0"/>
<text x="40.0" y="765.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11.0" fill="#111111" text-anchor="start">Five layers of the concurrency strategy</text>
<text x="40.0" y="794.7" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11.0" fill="#111111" text-anchor="start">1. Partial unique index ux_seat_active — unconditional, survives application bugs and horizontal scaling</text>
<text x="40.0" y="809.5" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11.0" fill="#111111" text-anchor="start">2. One transaction per booking, all seats inserted in a single SORTED batch — all or none, no deadlocks</text>
<text x="40.0" y="824.4" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11.0" fill="#111111" text-anchor="start">3. Fail-fast conflict mapping to 409 naming the lost seats — losers learn immediately instead of queueing</text>
<text x="40.0" y="839.2" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11.0" fill="#111111" text-anchor="start">4. resolveOrCreate via ON CONFLICT DO NOTHING — concurrent first-bookers converge on one instance, lock-free</text>
<text x="40.0" y="854.1" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11.0" fill="#111111" text-anchor="start">5. @Version on booking and flight_instance — guards status transitions (confirm, cancel) against lost updates</text>
