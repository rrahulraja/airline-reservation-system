<rect width="1464" height="899" fill="#ffffff"/>
<text x="48.0" y="40.9" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18.0" fill="#111111" text-anchor="start" font-weight="bold">Concurrency — Two Customers, One Seat</text>
<text x="48.0" y="59.6" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11.0" fill="#555555" text-anchor="start">Both transactions reach the INSERT. The partial unique index decides the winner — no row lock is taken on this path.</text>
