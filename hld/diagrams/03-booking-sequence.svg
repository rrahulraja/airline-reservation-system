<line x1="1140.0" y1="130.0" x2="1140.0" y2="790.0" stroke="#b85450" stroke-width="1" stroke-dasharray="6 5"/>
<text x="1140.0" y="113.9" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12.0" fill="#111111" text-anchor="middle">PostgreSQL</text>
<rect x="1260.0" y="215.0" width="310.0" height="175.0" rx="0" fill="#d5e8d4" stroke="#82b366" stroke-width="1" opacity="1.0"/>
<text x="1268.0" y="229.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="10.0" fill="#111111" text-anchor="start">Validation order matters</text>
<text x="1268.0" y="242.5" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="10.0" fill="#111111" text-anchor="start">1. active schedule by flight number — 404</text>
<text x="1268.0" y="256.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="10.0" fill="#111111" text-anchor="start">2. date within [today, today+365] — 422</text>
<text x="1268.0" y="269.5" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="10.0" fill="#111111" text-anchor="start">3. day-of-week in mask, date in validity — 422</text>
<text x="1268.0" y="283.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="10.0" fill="#111111" text-anchor="start">4. departure not already past — 422</text>
<text x="1268.0" y="296.5" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="10.0" fill="#111111" text-anchor="start">5. normalize labels, uppercase and trim — 400</text>
<text x="1268.0" y="310.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="10.0" fill="#111111" text-anchor="start">6. labels valid for aircraft geometry — 400</text>
<text x="1268.0" y="323.5" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="10.0" fill="#111111" text-anchor="start">7. no duplicate label in request — 400</text>
<text x="1268.0" y="337.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="10.0" fill="#111111" text-anchor="start">8. seat count within 1..max-seats — 400</text>
<text x="1268.0" y="350.5" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="10.0" fill="#111111" text-anchor="start">9. passenger count equals seat count — 400</text>
<text x="1268.0" y="377.5" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="10.0" fill="#111111" text-anchor="start">Nothing is written until all nine pass.</text>
<rect x="1260.0" y="520.0" width="310.0" height="195.0" rx="0" fill="#f8cecc" stroke="#b85450" stroke-width="2" opacity="1.0"/>
<text x="1268.0" y="534.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="10.0" fill="#111111" text-anchor="start">Why the explicit flush()</text>
<text x="1268.0" y="561.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="10.0" fill="#111111" text-anchor="start">Hibernate flushes at commit by default, and commit</text>
<text x="1268.0" y="574.5" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="10.0" fill="#111111" text-anchor="start">happens OUTSIDE the service method. Without an</text>
<text x="1268.0" y="588.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="10.0" fill="#111111" text-anchor="start">explicit flush inside the try block, the constraint</text>
<text x="1268.0" y="601.5" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="10.0" fill="#111111" text-anchor="start">violation escapes the catch and surfaces after the</text>
<text x="1268.0" y="615.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="10.0" fill="#111111" text-anchor="start">method returns — rendering 500 instead of 409.</text>
<text x="1268.0" y="642.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="10.0" fill="#111111" text-anchor="start">Flushing forces the INSERT to hit Postgres while</text>
<text x="1268.0" y="655.5" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="10.0" fill="#111111" text-anchor="start">the exception is still catchable. The constraint</text>
<text x="1268.0" y="669.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="10.0" fill="#111111" text-anchor="start">name is then read from PSQLException via</text>
<text x="1268.0" y="682.5" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="10.0" fill="#111111" text-anchor="start">getServerErrorMessage().getConstraint() and</text>
<text x="1268.0" y="696.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="10.0" fill="#111111" text-anchor="start">compared against &#x27;ux_seat_active&#x27;.</text>
<rect x="1260.0" y="420.0" width="310.0" height="80.0" rx="0" fill="#ffe6cc" stroke="#d79b00" stroke-width="1" opacity="1.0"/>
<text x="1268.0" y="434.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="10.0" fill="#111111" text-anchor="start">Why labels are sorted</text>
<text x="1268.0" y="447.5" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="10.0" fill="#111111" text-anchor="start">Concurrent transactions claiming overlapping seat</text>
<text x="1268.0" y="461.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="10.0" fill="#111111" text-anchor="start">sets in differing orders deadlock on index tuples.</text>
<text x="1268.0" y="474.5" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="10.0" fill="#111111" text-anchor="start">Sorting gives every transaction the same</text>
<text x="1268.0" y="488.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="10.0" fill="#111111" text-anchor="start">acquisition order, removing that failure class.</text>
